version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jira_clone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jira_clone
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jira_clone_backend
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/jira_clone?schema=public"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jira_clone_frontend
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: "http://localhost:4000/api/v1"

volumes:
  pgdata:

version: '3.9'

# SCORPION DevSecOps platform.
# Backend (Express API on 3001) + frontend (Vite build served by nginx on 80).
# State lives in Appwrite Cloud, so no local database service is required.
# Redis backs the BullMQ scan-execution queue (backend/src/queues/).
# Secrets/config are read from the local .env file (see backend/.env.example).

services:
  redis:
    image: redis:7-alpine
    container_name: scorpion_redis
    restart: unless-stopped
    # No published port: only the backend (same compose network, via REDIS_URL=redis://redis:6379)
    # talks to Redis. Publishing 6379 to the host previously exposed it to the public internet
    # on any host with an open firewall.
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scorpion_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scorpion_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  redis_data:

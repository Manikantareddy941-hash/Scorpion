version: 2
updates:
  # Frontend (root) npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript major is blocked: typescript-eslint crashes on TS 7 (PR #57).
      # Drop when typescript-eslint ships TS-7 support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Tailwind v4 replaces the JS config with a CSS-first model — a deliberate
      # styling migration, not an automated bump (PR #74). Bump by hand when scheduled.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Backend npm
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # bullmq exact-pins ioredis; a newer top-level ioredis duplicates the
      # dependency and breaks BullMQ connection types. Drop when bullmq unpins.
      - dependency-name: ioredis
      # TypeScript major is blocked: typescript-eslint crashes on TS 7 (PR #76).
      # Drop when typescript-eslint ships TS-7 support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node major tracks the Node runtime — bump deliberately alongside a
      # Node upgrade, not on its own (PR #80 failed Backend CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Container base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on even-numbered node LTS; odd majors (25, 27, ...) and
      # not-yet-LTS evens are noise. Bump deliberately instead.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

version: 2
updates:
  # Frontend (root) npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Backend npm
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # bullmq exact-pins ioredis; a newer top-level ioredis duplicates the
      # dependency and breaks BullMQ connection types. Drop when bullmq unpins.
      - dependency-name: ioredis
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Container base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on even-numbered node LTS; odd majors (25, 27, ...) and
      # not-yet-LTS evens are noise. Bump deliberately instead.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Without this the workflow token defaults to write-all, which
# these jobs never need: they check out, run tests, and upload an artifact.
# Flagged by Checkov as CKV2_GHA_1.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint Frontend
        # Warning ceiling frozen at the current count (ratchet). Lower it as
        # react-hooks/exhaustive-deps warnings get cleared; a NEW warning fails CI.
        run: npm run lint -- --max-warnings=23

      - name: Check TypeScript Types
        run: npm run typecheck

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Frontend
        # Dummy Appwrite env: the authenticated journeys mock the network at
        # the edge, but the SDK needs a syntactically valid endpoint to boot.
        env:
          VITE_APPWRITE_ENDPOINT: https://appwrite.e2e.invalid/v1
          VITE_APPWRITE_PROJECT_ID: e2e
          VITE_APPWRITE_DATABASE_ID: e2e
          VITE_APPWRITE_REPOS_COLLECTION_ID: repositories
          VITE_APPWRITE_VULNS_COLLECTION_ID: vulnerabilities
          VITE_APPWRITE_TASKS_COLLECTION_ID: tasks
        run: npm run build

      - name: Run E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scorpion
          POSTGRES_PASSWORD: scorpion
          POSTGRES_DB: scorpion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scorpion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint Backend
        working-directory: backend
        # Warning ceiling frozen at the current count (ratchet). Lower it over
        # time; a NEW warning fails CI. See backend/CLAUDE.md 'no any' standard.
        # 243 -> 169: the ceiling had drifted 74 above the real count, so it was
        # not holding any line. 169 is `npm run lint` as of this commit.
        # On failure, surface the tail of eslint output as an annotation so it
        # is visible via the checks API without log access.
        run: |
          npm run lint -- --max-warnings=169 >lint_out.txt 2>&1 || {
            echo "::error::LINT-FAIL $(tail -c 800 lint_out.txt | tr '\n' '|')"
            exit 2
          }

      - name: Build Backend
        working-directory: backend
        run: npm run build

      # `npm run build` is `prisma generate && tsc`, which EMITS. This is the
      # no-emit typecheck over the full include set — src, scripts and every
      # *.test.ts — which the build does not cover. Hard gate: currently zero
      # errors, so it holds the line from today rather than tolerating a backlog.
      - name: Check TypeScript Types
        working-directory: backend
        run: npx tsc --noEmit

      # Ratchet, not a cliff. There are 7 pre-existing cycles, six of them the
      # same shape: a repository facade importing its own pg adapter while the
      # adapter imports back. Failing on all 7 today would just get this step
      # deleted; failing on the 8th stops the bleed. Lower the baseline as they
      # are broken.
      #
      # --exclude '^generated/' keeps Prisma's codegen out of the count. Three of
      # its internal modules are mutually circular, and leaving them in would tie
      # this threshold to a file we do not write — regenerate the client and the
      # gate fires on nothing.
      #
      # --json + a parser, rather than grepping madge's human output for a count:
      # a grep that finds no match yields zero, so a crashed or misconfigured
      # madge would read as "no cycles" and PASS. This step fails closed — output
      # that will not parse is a failure, not a zero.
      - name: Check Circular Dependencies
        working-directory: backend
        run: |
          # Written outside the working tree so a local run of this step does not
          # drop an untracked madge.json into backend/.
          OUT="${RUNNER_TEMP:-/tmp}/madge.json"
          # `|| true` because madge exits 1 whenever it finds ANY cycle, and
          # Actions runs this under `bash -eo pipefail`. Without it the step
          # aborts here on every run — the baseline is 7, so there is always a
          # cycle — and the ratchet below never executes. That is a gate that
          # fails on every build, which gets deleted just as fast as one that
          # never fires.
          #
          # Discarding the exit code is safe ONLY because the parser below
          # validates the output: a madge that genuinely crashed writes nothing
          # parseable and still fails the step. The exit code is redundant here,
          # the output is the evidence.
          # Exact version, fetched rather than installed as a devDependency.
          # madge@8 declares peerDependencies { typescript: '^5.4.4' } and this
          # project is on TypeScript 6, so adding it to package.json makes plain
          # `npm ci --ignore-scripts` fail with ERESOLVE -- which is exactly the
          # command the Dockerfile builder stage runs. A lint tool is not worth
          # breaking the image build or adding --legacy-peer-deps to the
          # Dockerfile to paper over. Pin the version here instead; revisit when
          # madge supports TS 6.
          npx --yes madge@8.0.0 --circular --json --extensions ts \
              --ts-config tsconfig.json --exclude '^generated/' src/ > "$OUT" || true
          MADGE_OUT="$OUT" node -e '
            const fs = require("fs");
            const BASELINE = 7;
            let cycles;
            try {
              cycles = JSON.parse(fs.readFileSync(process.env.MADGE_OUT, "utf8"));
            } catch (err) {
              console.error("::error::madge produced output that could not be parsed — failing closed rather than reading it as zero cycles: " + err.message);
              process.exit(1);
            }
            if (!Array.isArray(cycles)) {
              console.error("::error::madge output was not an array of cycles — failing closed");
              process.exit(1);
            }
            console.log(`circular dependencies: ${cycles.length} (baseline ${BASELINE})`);
            if (cycles.length > BASELINE) {
              cycles.forEach((c, i) => console.log(`  ${i + 1}) ${c.join(" > ")}`));
              console.error(`::error::New circular dependency introduced (${cycles.length} > ${BASELINE}). Break the cycle, or lower nothing — the baseline only moves down.`);
              process.exit(1);
            }
          '

      # Same ratchet shape as madge above: a baseline that only moves down.
      #
      # This one counts logger calls that pass a second positional argument other
      # than an object literal or errorContext(err). It is a CONVENTION gate, not a
      # data-loss gate — winston preserves a bare Error, it just flattens it into
      # the message text so Loki gets no queryable `error` field to index on. The
      # sites that genuinely lost their cause were string arguments, and those are
      # already at zero.
      #
      # Lower the number as files are converted; the pass is finished at --max=0.
      # Unlike the response-leak gate below, 0 IS the destination here — there is
      # no category of bare second argument that should survive.
      #
      # 150 -> 127: tickets and threat-model, 23 sites.
      # 127 -> 100: scan parsers, monitor, ai, webhook, email, scan, 27 sites.
      - name: Logger Call Convention
        working-directory: backend
        run: node scripts/auditLoggerCalls.js --max=100

      # CWE-209. Counts internal error text reaching a 4xx/5xx response body:
      # errorMessage(err), err.message, String(err), or a local const bound to any
      # of those. On an unauthenticated route that hands Appwrite connection
      # details, jsonwebtoken internals or SMTP hostnames to anyone who can reach
      # the host.
      #
      # 31 is the TERMINAL baseline — the floor, not a work queue with items left
      # on it. 94 -> 73 -> 52 -> 31 across three sweeps; every site that returned
      # internal error text from a 5xx has been converted.
      #
      # What the remaining 31 are, and why they stay:
      #
      #   error: err.message on a 403/409   deliberate authorization and state
      #                                     feedback (TenantAccessError,
      #                                     CanaryAccessError, CanaryStateError)
      #                                     thrown by our own code — about the
      #                                     caller's own access, not internals
      #   parsed.error.issues[0].message    Zod validation on a 400 — the
      #                                     caller's own input
      #
      # The tool cannot tell Zod from Appwrite because both are `.message`, which
      # is why this number is not 0 and MUST NOT be driven to 0. Lowering it
      # further means deleting authorization feedback or validation messages the
      # client legitimately needs. If this fails, the right response is almost
      # always to fix the new site, never to raise the number.
      - name: Response Error Leak
        working-directory: backend
        run: node scripts/auditResponseErrorLeaks.js --max=31

      # --omit=dev, not --audit-level=critical. The only current HIGH is picomatch
      # via ts-node-dev -> chokidar, which is a devDependency and never reaches the
      # production image, so scoping to production deps lets the level stay at
      # `high` instead of being relaxed to `critical` to accommodate a finding that
      # does not ship.
      - name: Dependency Audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Run DB Migrations
        working-directory: backend
        run: npm run migrate:up
        env:
          DATABASE_URL: postgres://scorpion:scorpion@localhost:5432/scorpion

      - name: Run Backend Tests
        working-directory: backend
        run: npm run test
        env:
          RUN_DB_IT: "1"
          DATABASE_URL: postgres://scorpion:scorpion@localhost:5432/scorpion

      # Runs real containers to prove the workload isolation flags actually
      # hold. It lives in CI because a Linux runner is the only place it means
      # anything: Docker Desktop on Windows and macOS shares bind mounts through
      # a VM filesystem with permissive ownership, so the uid mismatch that
      # throws EACCES in production cannot reproduce on a developer machine.
      # The ubuntu runner has a real Docker daemon and a non-root checkout, so
      # the workspace-owner derivation is exercised the way a worker node does.
      - name: Container Isolation Smoke Test
        working-directory: backend
        run: node dist/backend/src/scripts/smoke_container_isolation.js

  k8s-runner:
    name: K8s Job Runner (kind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Downloaded directly at a pinned version rather than through a
      # third-party action, so the supply chain for a security test is one
      # auditable URL instead of someone else's composite action.
      - name: Install kind
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # kindnet, kind's default CNI, ACCEPTS NetworkPolicy objects and enforces
      # none of them. Testing the zero-egress policy against it would pass while
      # proving nothing. Calico actually enforces, so the assertion is real.
      - name: Create Cluster with an enforcing CNI
        run: |
          cat >kind-config.yaml <<'CFG'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: "192.168.0.0/16"
          CFG
          kind create cluster --name scorpion-ci --config kind-config.yaml --wait 60s
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

      # Only the namespace and RBAC. The full kustomization would also create a
      # Deployment whose image does not exist in this cluster, leaving a pod in
      # ImagePullBackOff that has nothing to do with what is being tested.
      - name: Apply Namespace, RBAC and the runner NetworkPolicy
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/rbac.yaml
          kubectl apply -f k8s/base/network-policy-runner.yaml
          kubectl get sa,role,rolebinding,networkpolicy -n scorpion

      # The dispatcher must run as the ServiceAccount it will use in production,
      # not as cluster-admin. Otherwise the Role is assumed rather than proven,
      # and a missing verb would only surface after deploy.
      - name: Build a kubeconfig for the backend ServiceAccount
        run: |
          TOKEN=$(kubectl create token scorpion-backend -n scorpion --duration=1h)
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' >ca.b64
          cat >sa.kubeconfig <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: kind
            cluster:
              server: ${SERVER}
              certificate-authority-data: $(cat ca.b64)
          users:
          - name: scorpion-backend
            user:
              token: ${TOKEN}
          contexts:
          - name: sa
            context:
              cluster: kind
              user: scorpion-backend
              namespace: scorpion
          current-context: sa
          EOF
          echo "KUBECONFIG=$PWD/sa.kubeconfig" >>"$GITHUB_ENV"

      # Proves the withheld verbs are actually withheld. Granting pod creation
      # would let a compromised backend run a container outside the Job
      # template's securityContext, so its absence is a security property.
      - name: Assert the Role grants only what it should
        run: |
          fail=0
          # Every verdict is printed before it is asserted, so a failure names
          # the check instead of exiting on an anonymous `set -e`.
          assert() {
            got=$(kubectl auth can-i $1 -n scorpion 2>/dev/null || true)
            echo "  $1 -> want=$2 got=$got"
            [ "$got" = "$2" ] || fail=1
          }
          assert "create jobs" yes
          assert "get pods" yes
          # `can-i get pods/log` parses the slash as a resource NAME, not a
          # subresource, so it silently answers for plain `pods` instead. Both
          # subresource checks need --subresource or they assert nothing.
          sub() {
            got=$(kubectl auth can-i $1 pods --subresource=$2 -n scorpion 2>/dev/null || true)
            echo "  $1 pods --subresource=$2 -> want=$3 got=$got"
            [ "$got" = "$3" ] || fail=1
          }
          sub get log yes
          sub create exec yes
          # The WebSocket client upgrades over GET, so this verb is load-bearing.
          sub get exec yes
          assert "create pods" no
          assert "delete pods" no
          assert "list secrets" no
          cluster=$(kubectl auth can-i list pods --all-namespaces 2>/dev/null || true)
          echo "  list pods cluster-wide -> want=no got=$cluster"
          [ "$cluster" = "no" ] || fail=1
          if [ "$fail" = "0" ]; then echo "Role scope confirmed"; else echo "RBAC assertions failed"; exit 1; fi

      # Pre-loaded so the pods never need a registry pull, which the zero-egress
      # policy would block anyway once it applies to the pod.
      - name: Pre-pull images into the cluster
        run: |
          docker pull alpine:3.20
          docker pull debian:12-slim
          kind load docker-image alpine:3.20 --name scorpion-ci
          kind load docker-image debian:12-slim --name scorpion-ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build Backend
        working-directory: backend
        run: npm run build

      # Asserts what the KUBELET enforced, by probing from inside the container.
      # A Pod object read back only echoes the spec that was submitted.
      - name: K8s Job Runner Smoke Test
        working-directory: backend
        run: node dist/backend/src/scripts/smoke_k8s_job_runner.js

      - name: Tear Down Cluster
        if: always()
        run: kind delete cluster --name scorpion-ci

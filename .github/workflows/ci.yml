name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Without this the workflow token defaults to write-all, which
# these jobs never need: they check out, run tests, and upload an artifact.
# Flagged by Checkov as CKV2_GHA_1.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint Frontend
        # Warning ceiling frozen at the current count (ratchet). Lower it as
        # react-hooks/exhaustive-deps warnings get cleared; a NEW warning fails CI.
        run: npm run lint -- --max-warnings=23

      - name: Check TypeScript Types
        run: npm run typecheck

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Frontend
        # Dummy Appwrite env: the authenticated journeys mock the network at
        # the edge, but the SDK needs a syntactically valid endpoint to boot.
        env:
          VITE_APPWRITE_ENDPOINT: https://appwrite.e2e.invalid/v1
          VITE_APPWRITE_PROJECT_ID: e2e
          VITE_APPWRITE_DATABASE_ID: e2e
          VITE_APPWRITE_REPOS_COLLECTION_ID: repositories
          VITE_APPWRITE_VULNS_COLLECTION_ID: vulnerabilities
          VITE_APPWRITE_TASKS_COLLECTION_ID: tasks
        run: npm run build

      - name: Run E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scorpion
          POSTGRES_PASSWORD: scorpion
          POSTGRES_DB: scorpion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scorpion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint Backend
        working-directory: backend
        # Warning ceiling frozen at the current count (ratchet). Lower it over
        # time; a NEW warning fails CI. See backend/CLAUDE.md 'no any' standard.
        # On failure, surface the tail of eslint output as an annotation so it
        # is visible via the checks API without log access.
        run: |
          npm run lint -- --max-warnings=243 >lint_out.txt 2>&1 || {
            echo "::error::LINT-FAIL $(tail -c 800 lint_out.txt | tr '\n' '|')"
            exit 2
          }

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run DB Migrations
        working-directory: backend
        run: npm run migrate:up
        env:
          DATABASE_URL: postgres://scorpion:scorpion@localhost:5432/scorpion

      - name: Run Backend Tests
        working-directory: backend
        run: npm run test
        env:
          RUN_DB_IT: "1"
          DATABASE_URL: postgres://scorpion:scorpion@localhost:5432/scorpion

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint Frontend
        run: npm run lint

      - name: Check TypeScript Types
        run: npm run typecheck

      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint Backend
        working-directory: backend
        run: npm run lint

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm run test

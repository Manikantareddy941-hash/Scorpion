# ArgoCD Application — syncs k8s/base from this repo into the cluster.
# Apply once to bootstrap GitOps:  kubectl apply -f k8s/argocd-app.yaml
#
# Points at k8s/base (committed), NOT k8s/overlays/dev (gitignored, local-only).
# Kept OUT of the base kustomization on purpose: this Application manages the
# tree, so bundling it would make Argo manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scorpion-backend
  namespace: argocd
spec:
  project: default
  source:
    # Set to this repository's clone URL.
    repoURL: https://github.com/Manikantareddy941-hash/Scorpion.git
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

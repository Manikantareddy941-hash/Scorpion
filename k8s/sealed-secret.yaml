# Bitnami SealedSecret — encrypts to Secret "scorpion-secrets" (consumed by
# deployment.yaml: CI_INGEST_API_KEY env + tls.crt/tls.key volume).
#
# PLACEHOLDER values below. Generate real ones (never commit raw secrets):
#
#   kubectl create secret generic scorpion-secrets \
#     --namespace default \
#     --from-literal=CI_INGEST_API_KEY="$INGEST_KEY" \
#     --from-file=tls.crt=certs/tls.crt \
#     --from-file=tls.key=certs/tls.key \
#     --dry-run=client -o yaml \
#   | kubeseal --format yaml --controller-namespace kube-system > k8s/sealed-secret.yaml
#
# NOTE: prompt named SCORPION_INGEST_KEY; the app reads CI_INGEST_API_KEY, so
# that is the key sealed here.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: scorpion-secrets
  namespace: default
spec:
  encryptedData:
    CI_INGEST_API_KEY: AgA_REPLACE_WITH_KUBESEAL_OUTPUT_INGEST_KEY
    tls.crt: AgB_REPLACE_WITH_KUBESEAL_OUTPUT_TLS_CRT
    tls.key: AgC_REPLACE_WITH_KUBESEAL_OUTPUT_TLS_KEY
  template:
    metadata:
      name: scorpion-secrets
      namespace: default
    type: Opaque

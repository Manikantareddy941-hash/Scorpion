# Scorpion backend Deployment + non-sensitive ConfigMap.
#
# Ports: 3001 = HTTP (PORT), 8443 = HTTPS (TLS_PORT, admission webhook).
# TLS_CERT/TLS_KEY are FILE PATHS (src/index.ts reads them with fs.readFileSync),
# so the cert/key come from a mounted secret volume, not env string values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scorpion-config
  labels:
    app.kubernetes.io/name: scorpion-backend
data:
  PORT: "3001"
  TLS_PORT: "8443"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis:6379"
  TLS_CERT: "/etc/scorpion/tls/tls.crt"
  TLS_KEY: "/etc/scorpion/tls/tls.key"
  # Non-sensitive Appwrite config (the app requires these to boot, see
  # src/index.ts requiredEnv). APPWRITE_API_KEY is the only secret one.
  APPWRITE_ENDPOINT: "https://sgp.cloud.appwrite.io/v1"
  APPWRITE_PROJECT_ID: "REPLACE_PROJECT_ID"
  APPWRITE_DATABASE_ID: "REPLACE_DATABASE_ID"
  FRONTEND_URL: "https://scorpion.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorpion-backend
  labels:
    app.kubernetes.io/name: scorpion-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scorpion-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scorpion-backend
    spec:
      containers:
        - name: scorpion-backend
          # kustomize rewrites this via `kustomize edit set image scorpion-backend=...`
          image: scorpion-backend:latest
          ports:
            - name: http
              containerPort: 3001
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: scorpion-config
          env:
            # NOTE: the app reads CI_INGEST_API_KEY (src/middleware/ciApiKey.ts),
            # not "SCORPION_INGEST_KEY" — wired to the real var so ingest works.
            - name: CI_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scorpion-secrets
                  key: CI_INGEST_API_KEY
            - name: APPWRITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scorpion-secrets
                  key: APPWRITE_API_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/scorpion/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: scorpion-secrets
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key

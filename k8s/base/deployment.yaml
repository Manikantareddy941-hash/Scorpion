# Scorpion backend Deployment + non-sensitive ConfigMap.
#
# Ports: 3001 = HTTP (PORT), 8443 = HTTPS (TLS_PORT, admission webhook).
# TLS_CERT/TLS_KEY are FILE PATHS (src/index.ts reads them with fs.readFileSync),
# so the cert/key come from a mounted secret volume, not env string values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scorpion-config
  namespace: scorpion
  labels:
    app.kubernetes.io/name: scorpion-backend
data:
  PORT: "3001"
  TLS_PORT: "8443"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis:6379"
  TLS_CERT: "/etc/scorpion/tls/tls.crt"
  TLS_KEY: "/etc/scorpion/tls/tls.key"
  # Non-sensitive Appwrite config (the app requires these to boot, see
  # src/index.ts requiredEnv). APPWRITE_API_KEY is the only secret one.
  APPWRITE_ENDPOINT: "https://sgp.cloud.appwrite.io/v1"
  APPWRITE_PROJECT_ID: "REPLACE_PROJECT_ID"
  APPWRITE_DATABASE_ID: "REPLACE_DATABASE_ID"
  FRONTEND_URL: "https://scorpion.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorpion-backend
  namespace: scorpion
  labels:
    app.kubernetes.io/name: scorpion-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scorpion-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scorpion-backend
    spec:
      # checkov:skip=CKV_K8S_35: APPWRITE_API_KEY / CI_INGEST_API_KEY are read from
      # process.env by the app (src/lib/appwrite.ts, middleware/ciApiKey.ts); a
      # file-mount migration is tracked separately, not a same-PR change.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scorpion-backend
          # kustomize rewrites this via `kustomize edit set image scorpion-backend=...`
          # CD pins a digest (…@sha256:…); the tag here is only a human-readable hint.
          # checkov:skip=CKV_K8S_43: image digest is injected by the CD pipeline.
          image: scorpion-backend:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3001
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: scorpion-config
          env:
            # NOTE: the app reads CI_INGEST_API_KEY (src/middleware/ciApiKey.ts),
            # not "SCORPION_INGEST_KEY" — wired to the real var so ingest works.
            - name: CI_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scorpion-secrets
                  key: CI_INGEST_API_KEY
            - name: APPWRITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scorpion-secrets
                  key: APPWRITE_API_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/scorpion/tls
              readOnly: true
            # readOnlyRootFilesystem is on, so every path the app writes to needs
            # an explicit writable mount: os.tmpdir() and the scanner clone dir
            # (RUNNER_MODE=binary clones repos into backend/tmp).
            - name: tmp
              mountPath: /tmp
            - name: backend-tmp
              mountPath: /app/backend/tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: backend-tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: scorpion-secrets
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
